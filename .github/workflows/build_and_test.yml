name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }} (generated)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            generator: Ninja
          - os: macos-latest
            generator: Ninja
          - os: windows-latest
            generator: "Visual Studio 17 2022"
    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Display Preinstalled Tools
      - name: Display preinstalled tools
        run: |
          cmake --version

      # Step 3: Install Ninja (if needed)
      - name: Install Ninja on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja on macOS
        if: matrix.os == 'macos-latest'
        run: brew install ninja

      - name: Verify Ninja Installation
        if: matrix.os != 'windows-latest'
        run: ninja --version || echo "Ninja is not available on this platform"

      # Step 4: Python for the generators. Only this job needs it: the
      # pre-generated job below must keep building without Python at all, which
      # is what lets clients consume the library without it.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # jsonschema is optional for the validator, which falls back to equivalent
      # hand-written checks when it is absent. Installing it here means the JSON
      # Schemas under docs/ are actually executed on every push, so a schema and
      # its hand-written counterpart cannot drift apart unnoticed.
      - name: Install schema validation dependency
        run: python -m pip install --upgrade pip jsonschema

      # Guard the step above: if the install silently failed, the validator would
      # quietly fall back and the schemas would stop being checked.
      - name: Verify the JSON Schemas are executed
        shell: bash
        run: |
          output=$(python tools/validate_legacy_mappings.py 2>&1)
          echo "$output"
          if grep -q "'jsonschema' module is not installed" <<<"$output"; then
            echo "::error::jsonschema is unavailable, so the JSON Schemas were not executed"
            exit 1
          fi

      # Step 5: Configure CMake
      - name: Configure CMake
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DSMUFL_MAPPING_USE_PREGENERATED_HEADERS=OFF

      # Step 6: Build with CMake
      - name: Build
        run: cmake --build build --parallel 2

      # Step 7: Run tests (separate handling for Windows multi-config)
      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Run tests (Unix & macOS)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure

  build-and-test-pregen:
    name: Build and Test on ${{ matrix.os }} (pre-generated)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            generator: Ninja
          - os: macos-latest
            generator: Ninja
          - os: windows-latest
            generator: "Visual Studio 17 2022"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display preinstalled tools
        run: |
          cmake --version

      - name: Install Ninja on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja on macOS
        if: matrix.os == 'macos-latest'
        run: brew install ninja

      - name: Verify Ninja Installation
        if: matrix.os != 'windows-latest'
        run: ninja --version || echo "Ninja is not available on this platform"

      - name: Configure CMake
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DSMUFL_MAPPING_USE_PREGENERATED_HEADERS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Run tests (Unix & macOS)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure
